(function(){
  if(window.__blocked) return;
  // Safeguards block shortcuts: F12, Ctrl/Cmd+Shift+I/J/C/K, Ctrl/Cmd+U, Ctrl/Cmd+S
  window.addEventListener('keydown', function(e){
    var k = (e.key||'').toLowerCase(), m = e.ctrlKey || e.metaKey;
    if(e.key==='F12' || (m && e.shiftKey && 'ijck'.indexOf(k)>-1) || (m && (k==='u' || k==='s')) || (e.metaKey && e.altKey && 'iuj'.indexOf(k)>-1)){

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3fb; --panel:#ffffff; --ink:#0c1630; --muted:#5b6a8c; --line:#d3ddf0;
  --accent:#0033ff; --accent-ink:#ffffff; --field:#f5f8fe;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04070f; --panel:#0a1226; --ink:#e6efff; --muted:#7d8fb8; --line:#16244a;
    --accent:#2f62ff; --accent-ink:#ffffff; --field:#070d1d;
  }
}
:root[data-theme="dark"]{
  --bg:#04070f; --panel:#0a1226; --ink:#e6efff; --muted:#7d8fb8; --line:#16244a;
  --accent:#2f62ff; --accent-ink:#ffffff; --field:#070d1d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"TikTok Sans","Helvetica Neue",Inter,system-ui,sans-serif;line-height:1.45}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;
  grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 4px;font-weight:900;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:60ch}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
canvas{-webkit-user-drag:none;user-select:none;display:block;width:100%;height:auto;border-radius:8px;background:#000;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.hint{color:var(--muted);font-size:13px;margin:8px 4px 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #73B5FF;outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:700}
label small{font-weight:500;color:var(--muted)}
textarea,select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--field);color:var(--ink)}
textarea{resize:vertical;min-height:72px;font-weight:800;font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
input[type=color]{width:100%;height:40px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--field)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.mark{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px 24px;opacity:.85}
</style>
</head>
<body>
<main>
  <header>
    <h1>Megumi text generator</h1>
    <p>Type your line, drag it into place, save the image. Everything renders in your browser on your own machine; nothing is uploaded.</p>
  </header>

  <section class="stage" aria-label="Preview">
    <canvas id="cv" width="1024" height="741" role="img" aria-label="Meme preview"></canvas>
    <p class="hint">Drag the text on the image to reposition it.</p>
    <div class="actions">
      <button class="primary" id="btnSave">Save PNG</button>
      <button id="btnCopy">Copy image</button>
      <button id="btnReset">Reset position</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="panel" aria-label="Controls">
    <label>Text <small>One line per row. The last line is the big one.</small>
      <textarea id="txt" rows="2">HELL YEAH</textarea>
    </label>
    <div class="chips" id="chips">
      <button type="button" data-t="HELL YEAH">Hell yeah</button>
      <button type="button" data-t="DID YOU SAY&#10;POTENTIAL">Did you say potential</button>
      <button type="button" data-t="YES HE DID">Yes he did</button>
      <button type="button" data-t="son 😭">son 😭</button>
    </div>

    <label>Size <small id="sizeV"></small>
      <input type="range" id="size" min="4" max="24" step="0.5" value="11">
    </label>
    <label>Glow strength <small id="glowV"></small>
      <input type="range" id="glow" min="0" max="200" step="5" value="100">
    </label>

    <label class="check"><input type="checkbox" id="small" checked> Shrink the lines above the last one</label>
    <label class="check"><input type="checkbox" id="upper" checked> Uppercase</label>

    <div class="row">
      <label>Text color <input type="color" id="c1" value="#73B5FF"></label>
      <label>Glow color <input type="color" id="c2" value="#0033FF"></label>
    </div>

    <label>Font</label>
  </section>
</main>
</body>
</html>
