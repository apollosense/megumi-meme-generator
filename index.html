<main>
  <header>

    <div class="actions">

      <button id="btnReset">Reset position</button>

    <p class="status" id="status" role="status"></p>
  </section>

  <section class="panel" aria-label="Controls">

    <div class="chips" id="chips">

    <label>Size <small id="sizeV"></small>

    </label>
    <label>Glow strength <small id="glowV"></small>
      <input type="range" id="glow" min="0" max="200" step="5" value="100">

    <label class="check"><input type="checkbox" id="small" checked> Shrink the lines above the last one</label>

    <div class="row">

      </label>
      <label>Glow Color
        <input type="color" id="glowColor" value="#0033ff">

    </div>
  </section>
</main>
